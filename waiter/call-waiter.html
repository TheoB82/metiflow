<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waiter on the way</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#111;color:#fff;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;padding:40px 24px;text-align:center;
    }
    .bell{font-size:72px;margin-bottom:24px;animation:ring .8s ease}
    @keyframes ring{
      0%,100%{transform:rotate(0)}
      15%{transform:rotate(-18deg)}
      30%{transform:rotate(18deg)}
      45%{transform:rotate(-12deg)}
      60%{transform:rotate(12deg)}
      75%{transform:rotate(-6deg)}
    }
    h1{font-size:26px;font-weight:700;margin-bottom:8px}
    .tbl{font-size:20px;font-weight:700;color:#FF6B35;margin:10px 0 18px}
    p{color:#888;font-size:15px;line-height:1.6}
    .brand{margin-top:52px;color:#444;font-size:11px;letter-spacing:.5px}
  </style>
</head>
<body>
  <div class="bell">&#x1F514;</div>
  <h1>Waiter on the way</h1>
  <div class="tbl" id="tbl-label"></div>
  <p>Your waiter has been notified<br>and will be with you shortly.</p>
  <div class="brand">powered by metiflow</div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://vljmmndwfttuglsqijso.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsam1tbmR3ZnR0dWdsc3FpanNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NTk0NTUsImV4cCI6MjA5NzAzNTQ1NX0.myJJsp_-EBOH-YI2iVv1De9xiFMFy9bqnCeHYOsOECU';
    const params = new URLSearchParams(location.search);
    const tableLabel = decodeURIComponent(params.get('t') || 'Table');
    const venueId = params.get('v') || '';
    document.getElementById('tbl-label').textContent = tableLabel;

    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const channel = client.channel('kf-alerts-' + venueId);

    channel.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await channel.send({
          type: 'broadcast',
          event: 'call_waiter',
          payload: { table: tableLabel },
        });
        setTimeout(() => client.removeChannel(channel), 2000);
      }
    });
  </script>
</body>
</html>
